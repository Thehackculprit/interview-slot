<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
body {font-family:Arial; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh;}
.login-container {background:white; padding:40px; border-radius:8px; width:400px;}
input {width:100%; padding:12px; margin-bottom:10px; border-radius:4px; border:1px solid #ddd;}
button {width:100%; padding:12px; border:none; border-radius:4px; background:#3498db; color:white; cursor:pointer;}
button:hover {background:#2980b9;}
</style>
</head>
<body>
<div class="login-container">
<h2>Admin Login</h2>
<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>
